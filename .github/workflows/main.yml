name: Build Chiaki-ng Windows (Anti-Recoil)
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          git
          unzip
          mingw-w64-ucrt-x86_64-toolchain
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja
          mingw-w64-ucrt-x86_64-json-c
          mingw-w64-ucrt-x86_64-miniupnpc
          mingw-w64-ucrt-x86_64-openssl
          mingw-w64-ucrt-x86_64-opus
          mingw-w64-ucrt-x86_64-python-pip
          mingw-w64-ucrt-x86_64-python-setuptools
          mingw-w64-ucrt-x86_64-hidapi
          mingw-w64-ucrt-x86_64-SDL2

    - name: Build and install argp-standalone
      run: |
        curl -LO https://www.lysator.liu.se/~nisse/misc/argp-standalone-1.3.tar.gz
        tar xzf argp-standalone-1.3.tar.gz
        cd argp-standalone-1.3
        ./configure --prefix=/ucrt64
        mingw32-make
        mingw32-make install
        cp libargp.a /ucrt64/lib/
        cp argp.h /ucrt64/include/

    - name: Patch cli/CMakeLists.txt
      run: |
        cat > cli/CMakeLists.txt << 'EOF'
        set(SOURCE
            include/chiaki-cli.h
            src/discover.c
            src/wakeup.c)
        add_library(chiaki-cli-lib STATIC ${SOURCE})
        target_include_directories(chiaki-cli-lib PUBLIC "include")
        target_link_libraries(chiaki-cli-lib chiaki-lib)
        if(CHIAKI_CLI_ARGP_STANDALONE)
            find_library(ARGP_LIBRARY NAMES argp libargp argp-standalone
                HINTS /ucrt64/lib)
            find_path(ARGP_INCLUDE_DIR argp.h HINTS /ucrt64/include)
            if(ARGP_LIBRARY)
                target_link_libraries(chiaki-cli-lib "${ARGP_LIBRARY}")
                target_include_directories(chiaki-cli-lib PUBLIC "${ARGP_INCLUDE_DIR}")
            else()
                message(FATAL_ERROR "argp library not found!")
            endif()
        endif()
        add_executable(chiaki-cli src/main.c)
        target_link_libraries(chiaki-cli chiaki-cli-lib)
        install(TARGETS chiaki-cli)
        EOF

    - name: Install Protoc and Python Tools
      run: |
        curl -LO https://github.com/protocolbuffers/protobuf/releases/download/v3.20.3/protoc-3.20.3-win64.zip
        unzip protoc-3.20.3-win64.zip -d protoc3
        cp protoc3/bin/protoc.exe /ucrt64/bin/
        python3 -m pip install "protobuf<=3.20.3" setuptools

    - name: Configure CMake
      run: |
        cmake -S . -B build -G "Ninja" \
          -DCMAKE_BUILD_TYPE=Release \
          -DCHIAKI_ENABLE_CLI=ON \
          -DCHIAKI_ENABLE_GUI=OFF \
          -DCHIAKI_CLI_ARGP_STANDALONE=ON \
          -DCHIAKI_USE_SYSTEM_NANOPB=OFF \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
          -DPython3_EXECUTABLE=/ucrt64/bin/python3.exe \
          -DPYTHON_EXECUTABLE=/ucrt64/bin/python3.exe \
          -Wno-dev

    - name: Build
      run: cmake --build build

    - name: Prepare Artifacts
      run: |
        mkdir -p release
        cp build/cli/chiaki-cli.exe release/
        cp /ucrt64/bin/libcrypto-*.dll release/ || true
        cp /ucrt64/bin/libssl-*.dll release/ || true
        cp /ucrt64/bin/libstdc++-6.dll release/ || true
        cp /ucrt64/bin/libgcc_s_*.dll release/ || true
        cp /ucrt64/bin/libwinpthread-*.dll release/ || true
        cp /ucrt64/bin/SDL2.dll release/ || true
        cp /ucrt64/bin/libhidapi-*.dll release/ || true

    - name: Upload Build
      uses: actions/upload-artifact@v4
      with:
        name: Chiaki-CLI-AntiRecoil
        path: release/
