name: Build Chiaki Windows (Anti-Recoil)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          git
          unzip
          curl
          mingw-w64-ucrt-x86_64-toolchain
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja
          mingw-w64-ucrt-x86_64-json-c
          mingw-w64-ucrt-x86_64-miniupnpc
          mingw-w64-ucrt-x86_64-openssl
          mingw-w64-ucrt-x86_64-opus
          mingw-w64-ucrt-x86_64-python-pip
          mingw-w64-ucrt-x86_64-hidapi
          mingw-w64-ucrt-x86_64-SDL2
          mingw-w64-ucrt-x86_64-ffmpeg
          mingw-w64-ucrt-x86_64-pkgconf

    - name: Install Protoc and Python Tools
      run: |
        curl -LO https://github.com/protocolbuffers/protobuf/releases/download/v3.20.3/protoc-3.20.3-win64.zip
        unzip protoc-3.20.3-win64.zip -d protoc3
        cp protoc3/bin/protoc.exe /ucrt64/bin/
        python3 -m pip install "protobuf<=3.20.3" setuptools --break-system-packages || true

    - name: RESTAURAR O CMAKELISTS ORIGINAL (A Cura)
      run: |
        curl -s https://raw.githubusercontent.com/srpc/chiaki/master/CMakeLists.txt -o CMakeLists.txt

    - name: Compile argp-standalone & Patch Source
      run: |
        # 1. Resolver o argp
        git clone https://github.com/tom42/argp-standalone.git
        cd argp-standalone
        sed -i 's/extern int getopt ();/extern int getopt (int, char *const *, const char *);/g' src/argp-getopt.h
        cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release
        cmake --build build
        find . -name "argp.h" -exec cp {} /ucrt64/include/ \;
        find build -name "*.a" -exec cp {} /ucrt64/lib/libargp.a \;
        find build -name "*.a" -exec cp {} /ucrt64/lib/libargp-standalone.a \;
        cd ..
        
        # 2. Corrigir Sockets no Windows
        sed -i 's/#include <sys\/socket.h>/#include <chiaki\/sock.h>/g' cli/src/discover.c cli/src/wakeup.c || true
        sed -i 's/#include <netdb.h>//g' cli/src/discover.c cli/src/wakeup.c || true
        sed -i 's/#include <netinet\/in.h>//g' cli/src/discover.c cli/src/wakeup.c || true
        sed -i 's/#include <arpa\/inet.h>//g' cli/src/discover.c cli/src/wakeup.c || true
        sed -i 's/sleep(1)/_sleep(1000)/g' cli/src/discover.c || true
        sed -i '1i #include <stdlib.h>' cli/src/discover.c || true
        
        # 3. Corrigir erro do FFMPEG 7.0
        sed -i 's/avcodec_close(decoder->codec_context);/avcodec_free_context(\&decoder->codec_context);/g' lib/src/ffmpegdecoder.c || true

    - name: Configure CMake
      run: |
        cmake -S . -B build -G "Ninja" \
          -DCMAKE_BUILD_TYPE=Release \
          -DCHIAKI_ENABLE_CLI=ON \
          -DCHIAKI_ENABLE_GUI=OFF \
          -DCHIAKI_ENABLE_FFMPEG_DECODER=ON

    - name: Build
      run: cmake --build build

    - name: Prepare Artifacts
      run: |
        mkdir -p release
        cp build/cli/chiaki-cli.exe release/
        cp /ucrt64/bin/libcrypto-*.dll release/ || true
        cp /ucrt64/bin/libssl-*.dll release/ || true
        cp /ucrt64/bin/libstdc++-6.dll release/ || true
        cp /ucrt64/bin/libgcc_s_*.dll release/ || true
        cp /ucrt64/bin/libwinpthread-*.dll release/ || true
        cp /ucrt64/bin/SDL2.dll release/ || true
        cp /ucrt64/bin/libhidapi-*.dll release/ || true
        cp /ucrt64/bin/av*.dll release/ || true
        cp /ucrt64/bin/sw*.dll release/ || true
        cp /ucrt64/bin/libz-*.dll release/ || true

    - name: Upload Build
      uses: actions/upload-artifact@v4
      with:
        name: Chiaki-CLI-AntiRecoil
        path: release/
